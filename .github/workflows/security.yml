name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, pdo_mysql
          coverage: none
          tools: composer
      - name: Install test-only sanitizer outside the module
        run: |
          mkdir -p "$RUNNER_TEMP/linguaflow-test-deps"
          composer require --working-dir="$RUNNER_TEMP/linguaflow-test-deps" ezyang/htmlpurifier:4.18.0 --no-interaction --no-progress
      - name: PHP syntax and security regressions
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          LFAI_TEST_PURIFIER_AUTOLOAD="$RUNNER_TEMP/linguaflow-test-deps/vendor/autoload.php" php tests/run.php
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with Gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts='--all' --redact --ignore-gitleaks-allow --no-banner
